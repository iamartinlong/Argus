name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # webassets/dist 为 go:embed 目标（gitignore），需先构建前端再 vet/test
      - name: Build web assets
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build

  binaries:
    name: Cross-build binaries
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build full binary (linux/amd64)
        run: |
          cd web && npm install --no-audit --no-fund && npm run build && cd ..
          CGO_ENABLED=0 go build -o argus ./cmd/argus
          CGO_ENABLED=0 go build -o argus-agent ./cmd/argus-agent
      - uses: actions/upload-artifact@v4
        with:
          name: argus-linux-amd64
          path: |
            argus
            argus-agent
