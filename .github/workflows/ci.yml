name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # webassets/dist 为 go:embed 目标（gitignore），需先构建前端再 vet/test
      - name: Build web assets
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build

  binaries:
    name: Cross-build binaries
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build full binary (linux/amd64)
        run: |
          cd web && npm install --no-audit --no-fund && npm run build && cd ..
          CGO_ENABLED=0 go build -o argus ./cmd/argus
          CGO_ENABLED=0 go build -o argus-agent ./cmd/argus-agent
      - uses: actions/upload-artifact@v4
        with:
          name: argus-linux-amd64
          path: |
            argus
            argus-agent

  # 发布：仅 tag 推送（v*）时运行。交叉编译 6 平台 → 打包 zip → 创建 GitHub Release 并上传。
  # 触发方式：git tag -a v1.2.0 -m "..." && git push github v1.2.0
  release:
    name: Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 前端产物是 go:embed 目标，必须先构建
      - name: Build web assets
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build
      - name: Cross-compile and package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          mkdir -p dist pkg
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%%/*}"; arch="${target##*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            echo ">> building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "dist/argus$ext" ./cmd/argus
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "dist/argus-agent$ext" ./cmd/argus-agent
            stage="pkg/argus-${ver}-${os}-${arch}"
            mkdir -p "$stage"
            cp "dist/argus$ext" "dist/argus-agent$ext" config.yaml.example LICENSE README.md "$stage/"
            cp -r deploy "$stage/"
            ( cd pkg && zip -q -r "argus-${ver}-${os}-${arch}.zip" "argus-${ver}-${os}-${arch}" )
            rm -rf "$stage"
          done
          ( cd pkg && sha256sum *.zip > SHA256SUMS.txt )
          ls -lh pkg/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" pkg/*.zip pkg/SHA256SUMS.txt \
            --title "Argus ${GITHUB_REF_NAME#v}" \
            --generate-notes
